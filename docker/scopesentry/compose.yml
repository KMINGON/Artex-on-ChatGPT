# 독립 실행: docker compose --env-file .local/mcp/scopesentry/.env -f docker/scopesentry/compose.yml up -d
# 초기 설정과 상태 파일은 scripts/prepare-mcp.py로 준비한다.
name: artex-scopesentry

services:
  scopesentry-mongodb:
    image: mongo:7.0.28@sha256:4510cf3d7050003e958745adb25d2deb3fb907430716162d9cc1a92eda2a6047
    platform: linux/amd64
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${SCOPESENTRY_MONGO_USER:-scopesentry}
      MONGO_INITDB_ROOT_PASSWORD: ${SCOPESENTRY_MONGO_PASSWORD:?ScopeSentry DB 비밀번호를 준비하세요}
    volumes:
      - scopesentry-mongodb:/data/db
      - scopesentry-mongodb-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  scopesentry-redis:
    image: redis:7.0.11@sha256:1008c73f08e9f913868e2fa2e843212b62ea5bf3c66435d87bc7a6207bc0f1b4
    platform: linux/amd64
    environment:
      REDISCLI_AUTH: ${SCOPESENTRY_REDIS_PASSWORD:?ScopeSentry Redis 비밀번호를 준비하세요}
    command: ["/bin/sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDISCLI_AUTH\""]
    volumes:
      - scopesentry-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(redis-cli ping)\" = PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  scopesentry:
    image: autumn27/scopesentry:1.9.4@sha256:7e32b3c491386dcb8f6d0f63443a6885085c627ed92b4d66e38cad7c39886436
    platform: linux/amd64
    ports:
      - "${SCOPESENTRY_BIND_IP:-127.0.0.1}:${SCOPESENTRY_PORT:-18083}:8082"
    # 서버만 ARTEX 네트워크에 연결하고 DB와 Scanner는 프로젝트 네트워크에 남긴다.
    networks:
      default:
      artex:
        aliases:
          - scopesentry
    environment:
      TIMEZONE: Asia/Seoul
      MONGODB_IP: scopesentry-mongodb
      MONGODB_PORT: "27017"
      MONGODB_DATABASE: ScopeSentry
      MONGODB_USER: ${SCOPESENTRY_MONGO_USER:-scopesentry}
      MONGODB_PASSWORD: ${SCOPESENTRY_MONGO_PASSWORD:?ScopeSentry DB 비밀번호를 준비하세요}
      REDIS_IP: scopesentry-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${SCOPESENTRY_REDIS_PASSWORD:?ScopeSentry Redis 비밀번호를 준비하세요}
    volumes:
      - scopesentry-files:/opt/ScopeSentry/files
      - scopesentry-images:/opt/ScopeSentry/images
      - scopesentry-uploads:/opt/ScopeSentry/uploads
      - type: bind
        source: ${SCOPESENTRY_STATE_DIR:?ScopeSentry 상태 파일을 먼저 준비하세요}/server-config.yaml
        target: /opt/ScopeSentry/config.yaml
        bind:
          create_host_path: false
      - type: bind
        source: ${SCOPESENTRY_STATE_DIR:?ScopeSentry 상태 파일을 먼저 준비하세요}/server-plugin-key
        target: /opt/ScopeSentry/PLUGINKEY
        bind:
          create_host_path: false
      - type: bind
        source: ${SCOPESENTRY_STATE_DIR:?ScopeSentry 상태 파일을 먼저 준비하세요}/server-password
        target: /opt/ScopeSentry/PASSWORD
        bind:
          create_host_path: false
    depends_on:
      scopesentry-mongodb:
        condition: service_healthy
      scopesentry-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8082/"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    restart: unless-stopped

  scopesentry-scanner:
    image: autumn27/scopesentry-scan:1.9.1@sha256:55f803d76641e8a5143ac386360fb6c9602710492170a8fc50b0326dfb29fc04
    platform: linux/amd64
    init: true
    # 프로젝트 bridge에서 DB에 연결한다. raw packet 기능은 호스트별 검증이 필요하다.
    ulimits:
      core:
        soft: 0
        hard: 0
    environment:
      NodeName: ${SCOPESENTRY_NODE_NAME:-artex-scopesentry-node}
      TimeZoneName: Asia/Seoul
      MONGODB_IP: scopesentry-mongodb
      MONGODB_PORT: "27017"
      MONGODB_DATABASE: ScopeSentry
      MONGODB_USER: ${SCOPESENTRY_MONGO_USER:-scopesentry}
      MONGODB_PASSWORD: ${SCOPESENTRY_MONGO_PASSWORD:?ScopeSentry DB 비밀번호를 준비하세요}
      REDIS_IP: scopesentry-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${SCOPESENTRY_REDIS_PASSWORD:?ScopeSentry Redis 비밀번호를 준비하세요}
    volumes:
      - scopesentry-scanner-config:/apps/config
      - scopesentry-scanner-data:/apps/data
      - scopesentry-dictionaries:/apps/dictionaries
      - scopesentry-poc:/apps/poc
      - scopesentry-plugins:/apps/plugin
    depends_on:
      scopesentry:
        condition: service_healthy
    restart: unless-stopped

volumes:
  scopesentry-mongodb:
  scopesentry-mongodb-config:
  scopesentry-redis:
  scopesentry-files:
  scopesentry-images:
  scopesentry-uploads:
  scopesentry-scanner-config:
  scopesentry-scanner-data:
  scopesentry-dictionaries:
  scopesentry-poc:
  scopesentry-plugins:

networks:
  default:
  artex:
    external: true
    name: ${ARTEX_NETWORK:?ARTEX Docker 네트워크 이름을 설정하세요}

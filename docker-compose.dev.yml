# scripts/dev-lab.py가 기본 Compose에 추가하는 로컬 개발 환경입니다.
x-dev-lab-labels: &dev-lab-labels
  com.artex.dev-lab.root: ${ARTEX_DEV_LAB_ROOT:?개발 환경 스크립트로 실행하세요}

services:
  postgres:
    labels: *dev-lab-labels
  artex:
    image: artex-on-chatgpt:dev-lab
    labels: *dev-lab-labels
    build:
      labels: *dev-lab-labels
  juiceshop:
    image: bkimminich/juice-shop@sha256:42843723a7bf4246aa5d63c324978b17ef296ac78434aeddd34c427bfb5853f4
    labels: *dev-lab-labels
    init: true
    ports:
      - "127.0.0.1:${JUICESHOP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "require('http').get('http://127.0.0.1:3000/', r => {r.resume(); process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
    labels: *dev-lab-labels
  artex-data:
    labels: *dev-lab-labels
  artex-auth:
    labels: *dev-lab-labels

networks:
  default:
    labels: *dev-lab-labels

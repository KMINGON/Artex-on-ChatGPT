services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artex-local-db}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  artex:
    init: true
    shm_size: 1gb
    image: artex-on-chatgpt:local
    pull_policy: never
    build:
      context: .
      target: app
      args:
        ARTEX_BUILD_VERSION: ${ARTEX_BUILD_VERSION:-docker-local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Components are encoded by the app, including special characters in passwords.
      ARTEX_PG_HOST: postgres
      ARTEX_PG_PORT: "5432"
      ARTEX_PG_USER: ${POSTGRES_USER:-artex}
      ARTEX_PG_PASSWORD: ${POSTGRES_PASSWORD:-artex-local-db}
      ARTEX_PG_DATABASE: ${POSTGRES_DB:-artex}
      ARTEX_PG_SSLMODE: disable
      # Only initialises an empty installation; never resets a saved password.
      ARTEX_ADMIN_PASSWORD: ${ARTEX_ADMIN_PASSWORD:-artex1234}
      ARTEX_AUTH_DIR: /app/auth
      XDG_CONFIG_HOME: /app/auth
      ARTEX_CHATGPT_CALLBACK_URL: http://127.0.0.1:${ARTEX_PORT:-8787}/auth/callback
      ARTEX_LANG: ${ARTEX_LANG:-ko}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
    ports:
      # Set ARTEX_BIND_IP=127.0.0.1 for PC-only access. DB/proxy stay unpublished.
      - "${ARTEX_BIND_IP:-0.0.0.0}:${ARTEX_PORT:-8787}:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - artex-data:/app/data
      - artex-auth:/app/auth
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  artex-data:
  artex-auth:

name: 버그 신고
description: Artex-on-ChatGPT의 오류나 기대와 다른 동작을 신고합니다.
title: "[버그] "
body:
  - type: textarea
    id: behavior
    attributes:
      label: 기대한 동작과 실제 동작
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 절차
      description: 실행한 명령과 화면에서 수행한 단계를 적어 주세요.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 실행 환경
      description: OS, Docker 여부, 커밋 해시, OpenAI API 또는 ChatGPT 구독 연결 여부와 모델을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 로그·스크린샷
      description: API 키, 로그인 토큰, 비밀번호와 개인 정보는 지워 주세요.

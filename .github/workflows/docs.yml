name: docs
# 자동 CI는 보류합니다. 필요한 경우 GitHub Actions에서 수동 실행합니다.
on:
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치의 중복 수동 실행을 취소합니다.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # python3 는 ubuntu-latest 러너에 기본 설치되어 있고, 스크립트는 표준
      # 라이브러리만 쓰므로 별도 설치 단계가 필요 없다. -I 로 사용자 사이트·환경을
      # 격리해 실행한다.
      - name: 문서 내부 링크·이미지·앵커 무결성 검사
        run: python3 -I scripts/check-doc-links.py
